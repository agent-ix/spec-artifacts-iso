manifest_version: 1.0.0
name: spec-artifacts-iso
version: 0.1.0
description: "Filament Module: ISO-style spec artifacts (FR, NFR, StR, US, IT, TC) — unified-shape archetypes (frontmatter schema + body_extraction asserts) validated by quire-rs; per-archetype authoring skeletons are the source of truth (no render templates); iso-spec-core grammar"
archetypes:
- kind: spec
  name: Spec
  description: Container holding ISO-style requirement artifacts
  doc_backed: true
  supports_membership: true
  composition:
    expected_artifacts:
    - StR
    - FR
    - NFR
    - US
    - IT
    - TC
grammars:
- name: iso-spec-core
  version: 0.1.0
  description: ISO-style requirements spec grammar
  doc_kinds:
  - spec

# FR-048 per-check severity. Promotion of an `ac` check is gated by
# quire-rs FR-047-CON-1: a corpus baseline sweep plus explicit user sign-off.
# Both were done on 2026-08-07 — 4,448 docs / 192 repos / 11,045 cells, both
# checks measured at 0 after the CR-024/025/026 checker fixes and the corpus
# sweep that followed. The engine default stays `warning`
# (quire-rs DEFAULT_SEVERITY, unchanged); this module declares the promotion,
# which is the lever CON-2 sanctions.
grammar_severity:
  ac:vacuous-outcome: error
  ac:non-singular: error

# FR-052 property-idiom registry (quire-rs FR-052, umbrella agent-ix/quire-rs#20).
# phrase -> {definition, shape}. Merged first-wins OVER the engine built-in idioms
# and applied AFTER the closed structural signals, so a declaration can only
# sharpen a label to a higher-precedence shape. `extractable` is derived from the
# structural shape alone (FR-052-CON-4), so nothing declared here can make a
# criterion extractable, or remove one from extraction — the registry is a
# booster, never a prerequisite.
#
# Deliberately small. quire-rs CR-014 retired `no-observable-outcome` because an
# open verb set whose membership was *required* to earn a label reached ~13%
# sampled precision; an aspirational phrase list here would recreate that shape.
# Two rules were applied to every candidate:
#
#   1. attested — the phrase occurs in the authored corpus (`/home/peter/dev/*/spec`,
#      counted by distinct file and repo, not by raw grep hit);
#   2. sufficient alone — the phrase, on its own, is evidence of the shape. The
#      matcher sees only the phrase, so a phrase that also names a subsystem is a
#      mislabel generator. `encode/decode` (30 files / 8 repos) was DECLINED on
#      this rule: nearly every occurrence is an API or seam name ("the encode/decode
#      seam", "the complete encode/decode/score API"), not a property claim. So were
#      `encoding/decoding`, `serialization/deserialization`, `read`/`write`,
#      `save/load`, `monotonic` (usually "monotonic clock") and bare `deterministic`
#      (excluded by FR-052 itself). `marshal`/`unmarshal` and `compress`/`inflate`
#      are unattested in the corpus and are therefore not declared.
#
# What is NOT declared because the engine built-ins already close it: `round-trip`
# / `round-trips` / `roundtrip` (both a composition signal and an identity
# back-reference), `byte-identical`, `losslessly`.
property_idioms:
  # RoundTrip. `losslessly` is a built-in back-reference; the adjective is not, so
  # "Pack then unpack of MSE indices is lossless for all bit widths 1-7" composes
  # but carries no back-reference and falls through to Universal without this.
  # 33 files / 10 repos.
  lossless:
    definition: "An operation asserted to preserve its input exactly, so composing it with its inverse recovers the original."
    shape: round-trip
  # 3 files / 1 repo (quire-rs FR-051). Names the composition outright; `then`
  # supplies the built-in composition signal but no identity back-reference follows.
  parse-then-serialize:
    definition: "The composition of a parse with the serialization of its result, asserted against the original text."
    shape: round-trip

  # Idempotence. Four inflections of one lemma that names a shape in the closed
  # enum outright. The built-in signal needs a repetition adverb (`twice`,
  # `again`, `re-run`, ...) in the same clause as an equality verb; a criterion
  # that simply says "re-activation is idempotent" carries neither.
  # `idempotent` 253 files / 81 repos, `idempotency` 149 / 54,
  # `idempotently` 49 / 31, `idempotence` 20 / 11.
  idempotent:
    definition: "Applying the operation a second time yields the result of the first."
    shape: idempotence
  idempotently:
    definition: "Adverbial form of `idempotent`: the operation is performed such that a repeat application changes nothing."
    shape: idempotence
  idempotence:
    definition: "The property that a repeat application of an operation yields the first result."
    shape: idempotence
  idempotency:
    definition: "Nominal form of `idempotence`, the spelling used in service and API criteria."
    shape: idempotence

  # Ordering. The built-in ordering lexicon is a closed set that does not carry
  # the term of art. 8 files / 6 repos, e.g. "Ranking is a total order - results
  # with absent `stars`/`updatedAt` sort last".
  total order:
    definition: "Every pair of elements is comparable, so the ordering is complete and not merely partial."
    shape: ordering
artifact_types:
- name: FR
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/fr-frontmatter.schema.json
  defaults:
    id_pattern: FR-{next:03d}
  allowed_links:
  - calls
  - publishes
  - consumes
  - triggers
  - reads
  - writes
  - requires
  - implements
  - depends_on
  - contains
  - transitions_to
  - references
  - constrains
  - supersedes
  - extends
  - specifies
  - governs
  - supports
  - traces_to
  - represents
  - derives_from
  - migrated_from
  - uses
  - projection_of
  - delegates_to
  - manages
  examples: []
  lint_rules_ref: []
  # Format-walkthrough decisions #1-#4 (2026-06-11): the `## Specification`
  # umbrella was never intended — Inputs/Outputs/Behavior are level-2
  # sections and OPTIONAL (object-kind FRs carry their kind's anchors
  # instead); Constraints is optional (no filler rows). Description +
  # AC table + Dependencies remain the required FR core.
  body_extraction:
    yield_pattern:
      match:
        description:
          from: section_body
          after_heading: Description
          required: true
          assert:
            level: 2
        inputs:
          from: section_body
          after_heading: Inputs
          required: false
          assert:
            level: 2
        outputs:
          from: section_body
          after_heading: Outputs
          required: false
          assert:
            level: 2
        behavior:
          from: section_body
          after_heading: Behavior
          required: false
          assert:
            level: 2
        constraints_table:
          from: table_row
          under_section: Constraints
          required: false
          assert:
            columns:
            - ID
            - Constraint
            - Type
            - Validation
            min_rows: 1
            id_column: ID
            id_pattern: '^{id}-CON-\d+$'
        acceptance_criteria:
          from: section_body
          after_heading: Acceptance Criteria
          required: true
          assert:
            level: 2
        acceptance_criteria_table:
          from: table_row
          under_section: Acceptance Criteria
          required: true
          assert:
            columns:
            - ID
            - Criteria
            - Verification
            min_rows: 1
            id_column: ID
            id_pattern: '^{id}-AC-\d+$'
        dependencies:
          from: section_body
          after_heading: Dependencies
          required: true
          assert:
            level: 2
- name: NFR
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/nfr-frontmatter.schema.json
  defaults:
    id_pattern: NFR-{next:03d}
  allowed_links:
  - constrains
  - references
  - depends_on
  - traces_to
  - verifies
  - supersedes
  - extends
  - uses
  - derives_from
  examples: []
  lint_rules_ref: []
  # Format-walkthrough decision #9 (2026-06-11): required NFR core is
  # Statement + Measurement and Evaluation table + Verification.
  # `quality_attribute` moved to FRONTMATTER (enum over ISO 25010
  # attributes, see schemas/nfr-frontmatter.schema.json) — the old
  # one-line `## Quality Attribute` section is retired. Scope /
  # Rationale / Dependencies / Acceptance Criteria are optional.
  body_extraction:
    yield_pattern:
      match:
        quality_attribute:
          from: frontmatter_field
          path:
          - quality_attribute
          required: false
        statement:
          from: section_body
          after_heading: Statement
          required: true
          assert:
            level: 2
        scope:
          from: section_body
          after_heading: Scope
          required: false
          assert:
            level: 2
        rationale:
          from: section_body
          after_heading: Rationale
          required: false
          assert:
            level: 2
        measurement_and_evaluation:
          from: section_body
          after_heading: Measurement and Evaluation
          required: true
          assert:
            level: 2
        measurement_table:
          from: table_row
          under_section: Measurement and Evaluation
          required: true
          assert:
            columns:
            - Metric
            - Target
            - Threshold
            - Method
            min_rows: 1
        verification:
          from: section_body
          after_heading: Verification
          required: true
          assert:
            level: 2
        # Optional by design: a *measurable* NFR's acceptance criteria are its
        # `Metric | Target | Threshold | Method` rows above, and it omits this
        # section entirely. This section is for a *policy* NFR whose compliance
        # checks do not reduce to a number ("evidence artifacts live under the
        # owning packet"). When present it takes the FR table shape, so the
        # section is either absent or well-formed — never unstructured prose.
        acceptance_criteria:
          from: section_body
          after_heading: Acceptance Criteria
          required: false
          assert:
            level: 2
            # `required: false` on the table below only means "no table, no
            # finding" — on its own it would let a *present* AC section stay
            # unstructured prose, which is exactly what this change removes.
            # Requiring the header row in the section body is what makes the
            # section either absent or well-formed.
            matches: '(?m)^\s*\|\s*ID\s*\|\s*Criteria\s*\|\s*Verification\s*\|'
        acceptance_criteria_table:
          from: table_row
          under_section: Acceptance Criteria
          required: false
          assert:
            columns:
            - ID
            - Criteria
            - Verification
            min_rows: 1
            id_column: ID
            id_pattern: '^{id}-AC-\d+$'
        dependencies:
          from: section_body
          after_heading: Dependencies
          required: false
          assert:
            level: 2
- name: StR
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/str-frontmatter.schema.json
  defaults:
    id_pattern: StR-{next:03d}
  allowed_links:
  - satisfied_by
  - depends_on
  - references
  - supersedes
  - traces_to
  - extends
  - represents
  examples: []
  lint_rules_ref: []
  # ISO-standard (2026-06-16): required StR core is Stakeholder Need +
  # Rationale + Validation Criteria (ISO/IEC/IEEE 29148 stakeholder-requirement
  # triad — the need, why it exists, and how its satisfaction is judged).
  # Stakeholders / context / constraints / dependencies / priority / notes /
  # traceability are optional.
  body_extraction:
    yield_pattern:
      match:
        stakeholder_need:
          from: section_body
          after_heading: Stakeholder Need
          required: true
          assert:
            level: 2
        rationale:
          from: section_body
          after_heading: Rationale
          required: true
          assert:
            level: 2
        validation_criteria:
          from: section_body
          after_heading: Validation Criteria
          required: true
          assert:
            level: 2
        # Binding criteria are addressable rows, on every archetype that has
        # them (FR, NFR, StR). The heading stays `Validation Criteria` and the
        # column stays `Validation`: ISO/IEC/IEEE 29148 splits *validation*
        # (evidence the requirements for a specific intended use are fulfilled
        # — the reference is the stakeholder's real need) from *verification*
        # (evidence the specified requirements are fulfilled — the reference is
        # the spec). A Stakeholder Requirements Specification is validated; a
        # System/Software Requirements Specification is verified. The table
        # shape and the heading name are independent decisions, and only the
        # shape is being unified.
        validation_criteria_table:
          from: table_row
          under_section: Validation Criteria
          required: true
          assert:
            columns:
            - ID
            - Criteria
            - Validation
            min_rows: 1
            id_column: ID
            id_pattern: '^{id}-VC-\d+$'
        stakeholders:
          from: section_body
          after_heading: Stakeholders
          required: false
          assert:
            level: 2
        context_and_assumptions:
          from: section_body
          after_heading: Context and Assumptions
          required: false
          assert:
            level: 2
        stakeholder_constraints:
          from: section_body
          after_heading: Stakeholder Constraints (Contextual)
          required: false
          assert:
            level: 2
        dependencies:
          from: section_body
          after_heading: Dependencies
          required: false
          assert:
            level: 2
        priority_and_risk:
          from: section_body
          after_heading: Priority and Risk (Informative)
          required: false
          assert:
            level: 2
        notes:
          from: section_body
          after_heading: Notes (Informative)
          required: false
          assert:
            level: 2
        traceability:
          from: section_body
          after_heading: Traceability
          required: false
          assert:
            level: 2
- name: US
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/us-frontmatter.schema.json
  defaults:
    id_pattern: US-{next:03d}
  allowed_links:
  - satisfied_by
  - traces_to
  - references
  - implements
  - exercises
  - depends_on
  - derives_from
  - migrated_from
  examples: []
  lint_rules_ref: []
  # ISO-standard (2026-06-16): required US core is just `Story` (ISO/IEC/IEEE
  # 29148 user-story shape — As a / I want / So that, enforced by a `matches`
  # regex). Every other section is OPTIONAL and contextual/informative — a US
  # carries discovery context, not normative requirements.
  body_extraction:
    yield_pattern:
      match:
        story:
          from: section_body
          after_heading: Story
          required: true
          assert:
            level: 2
            matches: '(?is)\bas an?\b.+\bi want\b.+\bso that\b'
        context:
          from: section_body
          after_heading: Context
          required: false
          assert:
            level: 2
        acceptance_examples:
          from: section_body
          after_heading: Acceptance Examples (Illustrative)
          required: false
          assert:
            level: 2
        options:
          from: section_body
          after_heading: Options (Exploratory)
          required: false
          assert:
            level: 2
        constraints:
          from: section_body
          after_heading: Constraints (Contextual)
          required: false
          assert:
            level: 2
        dependencies:
          from: section_body
          after_heading: Dependencies (Contextual)
          required: false
          assert:
            level: 2
        priority_and_risk:
          from: section_body
          after_heading: Priority and Risk (Informative)
          required: false
          assert:
            level: 2
        notes:
          from: section_body
          after_heading: Notes (Informative)
          required: false
          assert:
            level: 2
        traceability:
          from: section_body
          after_heading: Traceability (Informative)
          required: false
          assert:
            level: 2
- name: IT
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/it-frontmatter.schema.json
  defaults:
    id_pattern: IT-{next:03d}
  allowed_links:
  - verifies
  - depends_on
  - references
  examples: []
  lint_rules_ref: []
  # ISO-standard (2026-06-16): ISO/IEC/IEEE 29119 integration-test core is the
  # six-section required set — Objective, Target Integration, Preconditions,
  # Inputs, Test Procedure, Expected Results. Metadata / dependencies / notes /
  # traceability are optional.
  body_extraction:
    yield_pattern:
      match:
        objective:
          from: section_body
          after_heading: Objective
          required: true
          assert:
            level: 2
        target_integration:
          from: section_body
          after_heading: Target Integration
          required: true
          assert:
            level: 2
        preconditions:
          from: section_body
          after_heading: Preconditions
          required: true
          assert:
            level: 2
        inputs:
          from: section_body
          after_heading: Inputs
          required: true
          assert:
            level: 2
        test_procedure:
          from: section_body
          after_heading: Test Procedure
          required: true
          assert:
            level: 2
        expected_results:
          from: section_body
          after_heading: Expected Results
          required: true
          assert:
            level: 2
        metadata:
          from: section_body
          after_heading: Metadata
          required: false
          assert:
            level: 2
        dependencies:
          from: section_body
          after_heading: Dependencies
          required: false
          assert:
            level: 2
        notes:
          from: section_body
          after_heading: Notes
          required: false
          assert:
            level: 2
        traceability:
          from: section_body
          after_heading: Traceability
          required: false
          assert:
            level: 2
- name: TC
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/tc-frontmatter.schema.json
  defaults:
    id_pattern: TC-{next:03d}
  allowed_links:
  - verifies
  - references
  examples: []
  lint_rules_ref: []
  # ISO-standard (2026-06-16): minimal test-case core (ISO/IEC/IEEE 29119
  # test-case essentials) — Description, Test Procedure, Expected Results.
  body_extraction:
    yield_pattern:
      match:
        description:
          from: section_body
          after_heading: Description
          required: true
          assert:
            level: 2
        test_procedure:
          from: section_body
          after_heading: Test Procedure
          required: true
          assert:
            level: 2
        expected_results:
          from: section_body
          after_heading: Expected Results
          required: true
          assert:
            level: 2
# ISO-standard (2026-06-16): AC and CON archetypes removed — zero corpus usage.
# Acceptance Criteria are carried by the FR `## Acceptance Criteria` table and
# Constraints by the FR `## Constraints` table; standalone AC/CON artifacts are
# redundant with that normative FR structure.
- name: master-requirements
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/master-requirements-frontmatter.schema.json
  allowed_links:
  - depends_on
  - calls
  - publishes
  - consumes
  - reads
  - writes
  - triggers
  - requires
  - implements
  - references
  - supersedes
  - peer
  - contained_by
  - contains
  - deploys
  - uses
  - imports
  - generated_from
  - aggregates
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        title:
          from: heading
          level: 1
          regex: ^Master Requirements Specification$
          required: true
          assert:
            level: 1
        purpose:
          from: section_body
          after_heading: Purpose
          required: true
          assert:
            level: 2
        scope:
          from: heading
          level: 2
          regex: ^Scope$
          required: true
          assert:
            level: 2
        system_overview:
          from: heading
          level: 2
          regex: ^System Overview$
          required: true
          assert:
            level: 2
        requirements_architecture:
          from: heading
          level: 2
          regex: ^Requirements Architecture$
          required: true
          assert:
            level: 2
        references:
          from: section_body
          after_heading: References
          required: true
          assert:
            level: 2
# OKF reserved bundle files (index.md / log.md): first-class authored
# artifacts, validated like any other. Routed by frontmatter `type`
# (`index` / `log`). index.md navigation uses relative links that are
# LOCAL to the content — they are not knowledge-graph edges (ix:// owns
# those). log.md is non-normative authored history.
- name: index
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/index-frontmatter.schema.json
  allowed_links: []
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        contents:
          from: section_body
          after_heading: Contents
          required: true
          assert:
            level: 2
- name: log
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/log-frontmatter.schema.json
  allowed_links: []
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        history:
          from: section_body
          after_heading: History
          required: true
          assert:
            level: 2
- name: Glossary
  # FR-044: a project Ubiquitous-Language glossary. Its `## Terms` table
  # (Term | Definition) is harvested by quire-rs and fed to the EARS
  # object-aware vague-response check as accepted concrete terms.
  grammar_ref: iso-spec-core
  frontmatter_schema_ref: schemas/glossary-frontmatter.schema.json
  defaults:
    id_pattern: GLO-{next:03d}
  allowed_links:
  - references
  - depends_on
  examples: []
  lint_rules_ref: []
  body_extraction:
    yield_pattern:
      match:
        terms:
          from: section_body
          after_heading: Terms
          required: true

# =============================================================================
# spec-artifacts-iso — Markdown → record mappings (FR-007)
# =============================================================================
# How an authored ISO Markdown document becomes one of the FR-005 semantic
# records, declared as data so a consumer can build the record without reading
# this module's Python.
#
# Markdown is the sole authority (`authority: markdown`) and every record is a
# derived projection of it (`round_trip: derived`). Nothing in this module
# derives Markdown from a record (FR-007-CON-3).
#
# This file is AUTHORED, not generated. `manifest.yaml` is the independent
# truth TC-052 checks the `columns` lists against; generating them from it
# would make that assertion prove nothing.
#
# Every property of every emitted model has exactly one entry here, and every
# entry names a property its model declares (FR-007-AC-1, TC-052). Line
# numbers are 1-based document lines, counting the frontmatter block, exactly
# as `quire-rs` reports them.
# =============================================================================
version: 1

# FR-007: the eight mapping kinds, the same list `manifest.yaml` publishes
# under `semantic.mappings`.
kinds:
  - frontmatter
  - section
  - table
  - typed-table
  - ocl-clause
  - list
  - token
  - provenance

# The caller inputs the committed golden records under `examples/` were built
# from, so a consumer can reproduce them byte-for-byte (FR-007 Golden records,
# TC-044). `source_identity` is caller-supplied data, never synthesized by the
# mapping (FR-007 Behavior).
golden_records:
  source_identity: "ix://agent-ix/spec-artifacts-iso/skeletons"
  path_prefix: spec_artifacts_iso/skeletons
  serialization: sorted keys, two-space indent, trailing newline

# The parse and split rules the entries below name. Each is a closed rule of
# FR-007 Behavior; a mapping entry names one, it does not describe one.
parses:
  story: >-
    The three anchored lines `As a <asA>`, `I want <iWant>`, `So that
    <soThat>`, each optionally wrapped in `**`/`__`/`*`/`_` emphasis and
    optionally followed by `:`, matched case-insensitively at the start of a
    line. The captured text is trimmed and its surrounding emphasis markers
    removed. A `## Story` section missing any of the three fails the mapping
    naming the heading line.
  verification: >-
    A verification/validation cell split into `Verification { method,
    testRefs, annotation? }`: `method` is the text before the first `(`
    trimmed, `annotation` is the text between the first `(` and the last `)`
    verbatim, and `testRefs` are the `TC-[0-9]+` tokens of `annotation` in
    order. A cell with no parenthesised remainder is `method` alone with
    `testRefs: []` and no `annotation`. No byte of the cell is dropped.
  row-id: >-
    The row's id cell, which SHALL match the table's `row_id.pattern` with
    `{id}` bound to the document's frontmatter `id`, and SHALL be unique
    within the table. Either failure names the row's line.
  index-entry: >-
    One `* [title](href) - summary` or `- [title](href)` line at indent 0,
    the summary separated by a spaced `-` or em dash. A line matching neither
    form (prose, a nested bullet, a blank line) is not an entry and is not an
    error.
  log-entry: >-
    One `* **YYYY-MM-DD** — text` entry at indent 0; the bullet is `*` or `-`,
    the date may be wrapped in `**`/`__`, the dash separator is optional, and
    the entry extends to the next bullet at the same indentation. An entry
    carrying no date fails the mapping naming its line.
  success-criterion: >-
    One `IT-[0-9]+-SC-[0-9]+` token occurrence; `text` is the trimmed
    remainder of the token's line after an optional `:`.


emit:
  - "@typespec/json-schema"
options:
  "@typespec/json-schema":
    file-type: json
    emitAllModels: true
    emitAllRefs: true
    seal-object-schemas: true
    # Scratch only. `scripts/generate.mjs` overrides this with a tmpdir and
    # writes the bundle to `spec_artifacts_iso/schemas/`; this default exists
    # so a bare `tsp compile` cannot drop 48 files into `generated/`, which
    # the npm payload ships as a directory (FR-005-AC-9).
    emitter-output-dir: "{project-root}/.tsp-scratch"

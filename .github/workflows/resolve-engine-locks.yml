name: Resolve Quire 0.52.0 module locks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 2.3.1

      - name: Configure authenticated internal PyPI
        shell: bash
        env:
          GCP_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          poetry config repositories.internal-pypi \
            "https://us-west1-python.pkg.dev/agent-ix/internal-pypi/simple/"
          key64=$(printf '%s' "$GCP_KEY" | base64 -w 0)
          echo "::add-mask::$key64"
          poetry config http-basic.internal-pypi _json_key_base64 "$key64"

      - name: Check out module branches
        shell: bash
        run: |
          git clone --depth 1 --branch fix/part-of-inverse \
            https://github.com/agent-ix/spec-artifacts-iso.git modules/iso
          git clone --depth 1 --branch fix/part-of-inverse \
            https://github.com/agent-ix/spec-objects-business.git modules/business
          git clone --depth 1 --branch fix/quire-052 \
            https://github.com/agent-ix/spec-artifacts-process.git modules/process
          git clone --depth 1 --branch fix/quire-052 \
            https://github.com/agent-ix/spec-objects-architecture.git modules/architecture

      - name: Resolve locks against Quire 0.52.0
        shell: bash
        run: |
          for module in iso business process architecture; do
            (cd "modules/$module" && poetry lock --no-interaction)
          done

      - uses: actions/upload-artifact@v6
        with:
          name: quire-052-locks
          path: modules/*/poetry.lock
          if-no-files-found: error
